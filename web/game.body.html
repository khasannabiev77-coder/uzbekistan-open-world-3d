<title>Uzbekistan Open World 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D canvas; HUD pinned to safe-area corners; modal sheets centered over the city */
:root{
  color-scheme:dark;
  --ink:#061013; --panel:rgba(7,19,23,.9); --panel-soft:rgba(7,19,23,.62); --line:rgba(255,255,255,.13);
  --fg:#f4efe4; --muted:#9fb2b3; --kosh:#19b3b0; --kosh-deep:#0b6670; --gold:#e9b44c; --red:#e2574c; --green:#62c98b;
  --display:'Unbounded','Segoe UI',system-ui,sans-serif; --body:'Manrope','Segoe UI',system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--fg);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
.btn{font:700 15px/1 var(--body);padding:13px 18px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--fg);cursor:pointer;transition:background .15s,transform .1s}
.btn:hover{background:rgba(255,255,255,.12)} .btn:active{transform:scale(.97)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--kosh);outline-offset:2px}
.btn.primary{background:var(--kosh);border-color:var(--kosh);color:#03211f}
.btn.primary:hover{background:#26c7c3}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2a1a00}
.btn.danger{background:rgba(226,87,76,.16);border-color:rgba(226,87,76,.5)}
.btn[disabled]{opacity:.45;cursor:default}
.chip{font:700 13px/1 var(--body);padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.chip.on{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.eyebrow{font:800 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--kosh)}
.muted{color:var(--muted)}
.tab{font-variant-numeric:tabular-nums}

/* ---------- loading & menu ---------- */
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);z-index:50}
#loading .eyebrow{font-size:13px}
#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;background:linear-gradient(90deg,rgba(4,12,14,.92) 0%,rgba(4,12,14,.7) 38%,rgba(4,12,14,0) 72%)}
#menu .inner{padding-left:max(28px,calc(var(--sl) + 20px));padding-right:16px;max-width:560px;display:flex;flex-direction:column;gap:22px}
.logo{font-family:var(--display);font-weight:900;line-height:.92;letter-spacing:-.01em;margin:0}
.logo .a{display:block;font-size:clamp(38px,7vw,78px)}
.logo .b{display:block;font-size:clamp(18px,3.2vw,34px);color:var(--kosh);font-weight:700;margin-top:8px;letter-spacing:.04em}
.tagline{font-size:17px;line-height:1.5;margin:0;max-width:40ch;color:#dcd6ca;text-wrap:balance}
.menu-btns{display:flex;flex-direction:column;gap:10px;max-width:320px}
.menu-btns .btn{text-align:left;font-size:16px;padding:15px 20px}
.girih{height:10px;width:200px;background:repeating-linear-gradient(135deg,var(--kosh) 0 6px,transparent 6px 12px);opacity:.8;border-radius:2px}
.foot{font-size:12px;color:var(--muted)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud[hidden]{display:none!important}
.panel{background:var(--panel-soft);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#objective{position:absolute;left:max(16px,calc(var(--sl) + 12px));top:calc(var(--st) + 14px);max-width:min(380px,calc(100% - 200px));padding:12px 14px;display:flex;flex-direction:column;gap:6px}
#objText{font-weight:700;font-size:15px;line-height:1.35}
#objMeta{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted)}
#objArrow{width:18px;height:18px;display:inline-grid;place-items:center;color:var(--gold);font-weight:900}
#objTimer{color:var(--gold);font-weight:800}
#status{position:absolute;right:max(16px,calc(var(--sr) + 12px));top:calc(var(--st) + 14px);display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#money{font:700 20px/1 var(--display);color:var(--gold);padding:10px 14px}
#clock{font-size:13px;color:#e8e2d6;padding:8px 12px;font-weight:700}
#topbtns{display:flex;gap:8px;pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel-soft);color:var(--fg);font:800 14px/1 var(--body);cursor:pointer;display:grid;place-items:center}
#minimapWrap{position:absolute;left:max(16px,calc(var(--sl) + 12px));bottom:calc(var(--sb) + 16px);width:210px;height:210px;border-radius:18px;overflow:hidden;border:2px solid rgba(255,255,255,.18);box-shadow:0 8px 30px rgba(0,0,0,.35)}
#minimap{width:100%;height:100%;display:block}
#speedo{position:absolute;right:max(16px,calc(var(--sr) + 14px));bottom:calc(var(--sb) + 18px);padding:12px 16px;min-width:170px;display:flex;flex-direction:column;gap:8px}
#kmh{font:900 44px/1 var(--display)}
#kmh small{font:700 12px var(--body);color:var(--muted);margin-left:6px}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--kosh)}
.barlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 120px);padding:10px 16px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px;pointer-events:auto;cursor:pointer;white-space:nowrap}
#prompt kbd{font:800 13px/1 var(--body);background:var(--fg);color:var(--ink);padding:6px 9px;border-radius:7px}
#toasts{position:absolute;left:50%;top:calc(var(--st) + 86px);transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;width:min(520px,calc(100% - 32px))}
.toast{padding:11px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;text-align:center;animation:tin .25s ease-out}
.toast.good{border-color:rgba(98,201,139,.6)} .toast.bad{border-color:rgba(226,87,76,.6)} .toast.gold{border-color:rgba(233,180,76,.7);color:var(--gold)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#bubbles{position:absolute;inset:0;overflow:hidden}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fbf7ee;color:#1b1b1b;font-weight:700;font-size:13px;padding:7px 11px;border-radius:12px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fbf7ee;border-bottom:0}
#clickHint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 20px;font-weight:700}

/* ---------- touch controls ---------- */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
#touch[hidden]{display:none!important}
#joyZone{position:absolute;left:0;bottom:0;width:42%;height:62%;pointer-events:auto;touch-action:none}
#joyBase{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);left:calc(var(--sl) + 110px);top:calc(100% - var(--sb) - 110px)}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.55)}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(8,20,24,.45);color:#fff;font:800 12px/1.1 var(--body);display:grid;place-items:center;text-align:center;padding:4px}
.tb.down{background:rgba(25,179,176,.6);border-color:var(--kosh)}
.tb[hidden]{display:none!important}
#tAct{width:70px;height:70px;right:calc(var(--sr) + 30px);bottom:calc(var(--sb) + 200px);font-size:18px}
#tJump{width:84px;height:84px;right:calc(var(--sr) + 24px);bottom:calc(var(--sb) + 96px)}
#tSprint{width:70px;height:70px;right:calc(var(--sr) + 124px);bottom:calc(var(--sb) + 40px)}
#tGas{width:84px;height:84px;right:calc(var(--sr) + 24px);bottom:calc(var(--sb) + 96px)}
#tBrake{width:70px;height:70px;right:calc(var(--sr) + 124px);bottom:calc(var(--sb) + 40px)}
#tHand{width:62px;height:62px;right:calc(var(--sr) + 124px);bottom:calc(var(--sb) + 128px)}
#tCam{width:52px;height:52px;right:calc(var(--sr) + 116px);bottom:calc(var(--sb) + 210px)}
body.touch #minimapWrap{left:auto;right:max(16px,calc(var(--sr) + 12px));bottom:auto;top:calc(var(--st) + 128px);width:128px;height:128px}
body.touch #speedo{right:auto;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 12px);min-width:150px;padding:8px 14px}
body.touch #kmh{font-size:30px}
body.touch #prompt{bottom:calc(var(--sb) + 112px)}
body.touch #objective{max-width:min(320px,calc(100% - 190px))}
body.touch #objText{font-size:13px}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(2,8,10,.55);padding-left:max(16px,var(--sl));padding-right:max(16px,var(--sr));padding-block:calc(var(--st) + 16px) calc(var(--sb) + 16px)}
.sheet[hidden]{display:none!important}
.card{width:min(760px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
.card h2{font:700 22px/1.1 var(--display);margin:0;text-wrap:balance}
.card h3{font:800 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.03);min-width:0}
.item.sel{border-color:var(--kosh);background:rgba(25,179,176,.08)}
.item .nm{font:700 16px/1.1 var(--display)}
.item .cl{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.price{font:700 15px var(--display);color:var(--gold)}
.stat{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:38px;height:38px;border-radius:10px;border:2px solid rgba(255,255,255,.2);cursor:pointer}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--kosh)}
.setrow{display:flex;flex-direction:column;gap:8px}
input[type=range]{width:100%;accent-color:var(--kosh)}
#mapCanvas{width:100%;border-radius:12px;display:block;cursor:crosshair;background:#12201c}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.dialog{width:min(640px,100%)}
.speaker{font:700 14px var(--display);color:var(--kosh)}
.dtext{font-size:17px;line-height:1.55;margin:0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;align-items:center}
.keys kbd{font:800 12px/1 var(--body);background:rgba(255,255,255,.12);padding:6px 8px;border-radius:6px;justify-self:start;white-space:nowrap}
@media (max-width:560px){ .card{padding:16px} .grid{grid-template-columns:1fr} #menu{background:linear-gradient(0deg,rgba(4,12,14,.95) 30%,rgba(4,12,14,.35) 100%);align-items:flex-end;padding-bottom:calc(var(--sb) + 18px)} }
@media (prefers-reduced-motion:reduce){ .toast{animation:none} .btn{transition:none} }
</style>

<div id="menu" hidden>

<div class="sheet" id="controlsSheet" hidden><div class="card" style="width:min(560px,100%)">

<div class="sheet" id="garage" hidden><div class="card">

</div></div>

<div class="sheet" id="mapSheet" hidden><div class="card" style="width:min(1100px,100%)">

<script>
(()=>{
'use strict';
if(!window.THREE){ document.getElementById('loading').innerHTML='<div style="padding:24px;max-width:420px;text-align:center;line-height:1.5">3D kutubxona yuklanmadi. Internetga ulanib, sahifani qayta oching.<br>3D library failed to load. Connect to the internet and reload.</div>'; return; }

/* =====================================================================
   UZBEKISTAN OPEN WORLD 3D — Web Edition
   Modules: I18N · Save · Renderer · World · Vehicles · Traffic · Player
            NPC · Camera · Input · Missions · Economy · Env · Audio · Map
   ===================================================================== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
let seed=20261117; const srnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
const sr=(a,b)=>a+srnd()*(b-a), spick=a=>a[Math.floor(srnd()*a.length)];
const angDiff=(a,b)=>{let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;};
const smooth=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const isTouch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window&&navigator.maxTouchPoints>0);

/* ============================== I18N ============================== */
const I18N={

const t=k=>{const d=I18N[S.lang]||I18N.uz;const v=d[k];return v===undefined?(I18N.en[k]!==undefined?I18N.en[k]:k):v;};
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' '+t('sum');
function applyLang(){ document.documentElement.lang=S.lang; document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);}); buildKeysList(); renderLangChips(); hudDirty=true; }

/* ============================== SAVE ============================== */
const SAVE_KEY='uzow3d_save_v1';
const detectLang=()=>{const l=(navigator.language||'uz').toLowerCase();return l.startsWith('ru')?'ru':l.startsWith('en')?'en':'uz';};
const DEFAULT_SAVE=()=>({v:2,started:false,money:3000000,owned:['chumchuq'],active:'chumchuq',mods:{},health:{},fuel:{},mission:0,shirt:'#2f6fb0',props:{house:false,business:false},pos:null,time:8.5,day:1,
  lang:detectLang(),quality:isTouch?'medium':'high',fps:60,weather:'auto',sens:1,vol:0.7,waypoint:null,jobs:0});
let S=DEFAULT_SAVE();
function loadSave(){ try{const r=localStorage.getItem(SAVE_KEY); if(r){const o=JSON.parse(r); S=Object.assign(DEFAULT_SAVE(),o); S.props=Object.assign({house:false,business:false},o.props||{}); return true;}}catch(e){} return false; }
function persist(){ try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){} }
function saveGame(showToast){ if(state==='play'){ S.pos={x:P.inCar?car.x:P.x,z:P.inCar?car.z:P.z,h:P.inCar?car.h:P.h,inCar:P.inCar}; if(car){S.health[car.type]=car.health;S.fuel[car.type]=car.fuel;} } persist(); if(showToast) toast(t('saved'),'good'); }
loadSave();

/* ============================ RENDERER ============================ */
const canvas=$('#game');
if((S.v||1)<2){S.v=2;if(S.quality==='low')S.quality=isTouch?'medium':'high';}
const QUALITY={low:{pr:1,shadow:0,traffic:14,peds:16,far:450,precip:500},medium:{pr:1.3,shadow:1024,traffic:22,peds:28,far:640,precip:900},high:{pr:2,shadow:2048,traffic:34,peds:46,far:880,precip:1500}};
let Q=QUALITY[S.quality]||QUALITY.medium;
const USE_STD=S.quality!=='low';

const CG=32, cgrid=new Map(); let cstamp=0; const nearBuf=[];

function nearC(x,z,r){nearBuf.length=0;cstamp++;for(let gx=Math.floor((x-r)/CG);gx<=Math.floor((x+r)/CG);gx++)for(let gz=Math.floor((z-r)/CG);gz<=Math.floor((z+r)/CG);gz++){const a=cgrid.get(gx*100003+gz);if(a)for(const c of a){if(c.s!==cstamp){c.s=cstamp;nearBuf.push(c);}}}return nearBuf;}
function resolve(o,r){let hit=null;const list=nearC(o.x,o.z,r);for(const c of list){const px=clamp(o.x,c.x0,c.x1),pz=clamp(o.z,c.z0,c.z1);let dx=o.x-px,dz=o.z-pz;const d2=dx*dx+dz*dz;if(d2>=r*r)continue;
  if(!hit)hit={nx:0,nz:0};if(d2>1e-8){const d=Math.sqrt(d2);dx/=d;dz/=d;o.x+=dx*(r-d);o.z+=dz*(r-d);hit.nx+=dx;hit.nz+=dz;}
  else{const l=o.x-c.x0,rr=c.x1-o.x,b=o.z-c.z0,tt=c.z1-o.z,m=Math.min(l,rr,b,tt);if(m===l){o.x=c.x0-r;hit.nx-=1;}else if(m===rr){o.x=c.x1+r;hit.nx+=1;}else if(m===b){o.z=c.z0-r;hit.nz-=1;}else{o.z=c.z1+r;hit.nz+=1;}}}
  if(hit){const l=Math.hypot(hit.nx,hit.nz)||1;hit.nx/=l;hit.nz/=l;}return hit;}

  const trim=C(col).clone().multiplyScalar(0.78);
  box(x,y0+h+0.04,z,W-0.2,0.08,D-0.2,'#7c786f');

function genGraph(){
  for(const d of DIST){const L=[];for(let i=0;i<=d.n;i++)L.push((i-d.n/2)*CELL);d.lines=L;d.grid=[];
    for(let i=0;i<=d.n;i++){d.grid[i]=[];for(let j=0;j<=d.n;j++)d.grid[i][j]=addNode(d.cx+L[i],d.cz+L[j]);}
    for(let i=0;i<=d.n;i++)for(let j=0;j<=d.n;j++){if(i<d.n)link(d.grid[i][j],d.grid[i+1][j]);if(j<d.n)link(d.grid[i][j],d.grid[i][j+1]);}
    for(let i=0;i<d.n;i++)for(let j=0;j<d.n;j++)blocks.push({d:d.id,i,j,cx:d.cx+(L[i]+L[i+1])/2,cz:d.cz+(L[j]+L[j+1])/2,type:null});}
  const a=DIST[0].grid[6][3],b=DIST[1].grid[0][2];const mid=addNode((a.x+b.x)/2,0);mid.hw=true;link(a,mid,true);link(mid,b,true);
  for(const n of nodes)n.light=n.nb.length>=3&&!n.hw;
}
const blk=(d,i,j)=>blocks.find(b=>b.d===d&&b.i===i&&b.j===j);

function genRoads(){
  for(const e of edges){const A=nodes[e.a],Bn=nodes[e.b],dx=Bn.x-A.x,dz=Bn.z-A.z,L=Math.hypot(dx,dz),hz=Math.abs(dx)>Math.abs(dz),w=e.hw?16:ROAD,len=L-16;
    const cx=(A.x+Bn.x)/2,cz=(A.z+Bn.z)/2;quad(cx,0.02,cz,hz?len:w,hz?w:len,e.hw?'#6a6764':'#74716c','r');
    const ux=dx/L,uz=dz/L;for(let s=12;s<L-14;s+=7){const x=A.x+ux*(s+1.5),z=A.z+uz*(s+1.5);quad(x,0.03,z,hz?3:0.22,hz?0.22:3,e.hw?COL.yel:COL.line);}
    if(e.hw){quad(cx,0.03,cz+7.3,len,0.25,COL.line);quad(cx,0.03,cz-7.3,len,0.25,COL.line);
      for(let s=20;s<L-10;s+=40){const x=A.x+ux*s;lamp(x,cz+9.5,0,-1);lamp(x+20,cz-9.5,0,1);}}}
  for(const n of nodes){quad(n.x,0.021,n.z,16,16,'#74716c','r');
    if(n.light){for(const id of n.nb){const o=nodes[id];if(edges.find(e=>e.hw&&((e.a===n.id&&e.b===id)||(e.b===n.id&&e.a===id))))continue;const ux=Math.sign(o.x-n.x),uz=Math.sign(o.z-n.z);
      for(let k=-5;k<=5;k+=2.2){if(ux)quad(n.x+ux*10.5,0.032,n.z+k,3.2,1,'#e9e4d6');else quad(n.x+k,0.032,n.z+uz*10.5,1,3.2,'#e9e4d6');}
      if(ux)quad(n.x+ux*12.8,0.032,n.z+ux*3.5*(-1),0.4,6.6,'#f2eee2');else quad(n.x+uz*3.5,0.032,n.z+uz*12.8,6.6,0.4,'#f2eee2');}}}
}

function nearestNode(x,z){let best=null,bd=1e9;for(const n of nodes){const d=(n.x-x)**2+(n.z-z)**2;if(d<bd){bd=d;best=n;}}return best;}
function route(fx,fz,tx,tz){const s=nearestNode(fx,fz),g=nearestNode(tx,tz);const dist=new Float64Array(nodes.length).fill(Infinity),prev=new Int32Array(nodes.length).fill(-1),done=new Uint8Array(nodes.length);dist[s.id]=0;

let promptAction=null;
function findPrompt(){
  if(P.inCar&&car){const sp=Math.abs(car.vF);for(const p of poiList){if(p.type==='fuel'&&near(p,10)&&sp<3)return{key:'p_fuel',fn:()=>refuel()};}if(near(POI.garage,13)&&sp<3)return{key:'p_garage',fn:()=>openGarage('cars')};if(sp<4)return{key:'p_exit',fn:exitCar};return null;}
  if(car&&Math.hypot(P.x-car.x,P.z-car.z)<car.r+2.6)return{key:'p_enter',fn:enterCar};
  if(near(POI.garage,5))return{key:'p_garage',fn:()=>openGarage('cars')};if(near(POI.shop,5))return{key:'p_shop',fn:openShop};if(near(POI.choyxona,5))return{key:'p_choyxona',fn:openChoyxona};
  if(S.props.house&&near(POI.house,5))return{key:'rest',fn:rest};
  for(const p of peds){if(p.mesh.visible&&Math.hypot(P.x-p.x,P.z-p.z)<2.4)return{key:'p_talk',fn:()=>{say(p,pick(t('greet')),3);p.stop=3;p.face=Math.atan2(P.x-p.x,P.z-p.z);beep(660,0.08,'sine',0.06);}};}
  return null;}
function enterCar(){P.inCar=true;cam.manual=0;hudDirty=true;beep(220,0.12,'square',0.05);}
function exitCar(){const lx=Math.cos(car.h),lz=-Math.sin(car.h);P.x=car.x+lx*(car.r+1.1);P.z=car.z+lz*(car.r+1.1);tmpObj.x=P.x;tmpObj.z=P.z;resolve(tmpObj,0.4);P.x=tmpObj.x;P.z=tmpObj.z;P.y=groundY(P.x,P.z);P.h=car.h;P.inCar=false;car.vx=car.vz=car.vF=0;cam.yaw=car.h;hudDirty=true;saveGame(false);}
function refuel(){const need=100-car.fuel;if(need<1){toast(t('refueled'));return;}const cost=Math.ceil(need)*12000;if(S.money<cost){toast(t('not_enough')+' ('+fmt(cost)+')','bad');return;}S.money-=cost;car.fuel=100;toast(t('refueled')+' −'+fmt(cost),'good');playCash();saveGame(false);}
function rest(){S.time=7;S.day++;onNewDay();toast(t('rested'),'good');}
function callCar(){if(P.inCar)return;if(S.money<100000){toast(t('not_enough'),'bad');return;}let best=null,bd=1e9;for(const e of edges){const A=nodes[e.a],Bn=nodes[e.b],dx=Bn.x-A.x,dz=Bn.z-A.z,L2=dx*dx+dz*dz;const tt=clamp(((P.x-A.x)*dx+(P.z-A.z)*dz)/L2,0.15,0.85);const x=A.x+dx*tt,z=A.z+dz*tt,d=(x-P.x)**2+(z-P.z)**2;if(d<bd){bd=d;const L=Math.sqrt(L2);best={x:x-dz/L*3.5,z:z+dx/L*3.5,h:Math.atan2(dx,dz)};}}
  if(best){S.money-=100000;saveCarState();spawnCar(S.active,best.x,best.z,best.h);toast(t('called_car'),'good');closeModal();}}

function processActions(){

  if(state!=='play'){actions.clear();return;}
  for(const a of actions){switch(a){case 'pause':openModal('pause');break;case 'map':openMap();break;case 'interact':{const pr=findPrompt();if(pr)pr.fn();break;}
    case 'jump':IN.jump=true;break;case 'camera':if(P.inCar)cam.fp=!cam.fp;break;case 'horn':if(P.inCar)horn();break;case 'callcar':callCar();break;}}
  actions.clear();}

  if(state==='play'){readInput(dt);processActions();
    if(!modal){gameClock+=dt;if(P.inCar&&car){const inp=IN;driveCar(car,dt,inp);P.x=car.x;P.z=car.z;}else{updatePlayer(dt,IN);if(car)placeCarMesh(car,0);}
      if(P.inCar&&car&&Math.abs(car.vF)>0.1&&car.spec.cls!=='moto'){/* driving */}
      updateTraffic(dt);updatePeds(dt);updateLights();updateMissions(dt);updateGPS(dt);saveT-=dt;if(saveT<0){saveT=15;saveGame(false);}}
    updateMarker();updateHUD(dt);updateBubbles();}
  else{gameClock+=dt;updateLights();}
  updateEnv(dt);updateCamera(dt);updateAudio(dt);renderer.render(scene,camera);}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){saveGame(false);if(!modal)openModal('pause');}});

function boot(){applyLang();resize();setTimeout(()=>{buildWorld();makePlayer();const gp=garageSpot();spawnCar(S.active,gp.x,gp.z,gp.h);const pb=blk('tk',2,2);P.x=pb.cx;P.z=pb.cz-HB+2.5;
  setTrafficCount(Math.min(14,Q.traffic));applyQuality();$('#loading').hidden=true;toMenu();requestAnimationFrame(frame);},30);}
window.UZ={get cam(){return cam;},camera,get P(){return P;},get car(){return car;},get S(){return S;},get state(){return state;},get modal(){return modal;},traffic,peds,nodes,POI,MS_,STORY};
boot();
})();
